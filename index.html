
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yazıcıoğlu Ticaret - Stok Takip</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f4f8;color:#222}
.container{max-width:480px;margin:35px auto;padding:20px}
.card{background:white;padding:24px;border-radius:14px;box-shadow:0 3px 15px #0001}
h2{text-align:center;color:#183b62}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#174b7a;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#667788}
button.danger{background:#b52b35}
button:disabled{opacity:.5}
.hidden{display:none}
.message{text-align:center;padding:10px;margin-top:10px;border-radius:8px;background:#edf3f8}
.person{border:1px solid #ddd;padding:12px;border-radius:9px;margin:10px 0}
.person button{width:48%;font-size:14px}
.actions{display:flex;justify-content:space-between;gap:8px}
small{color:#666}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>YAZICIOĞLU TİCARET</h2>
    <p style="text-align:center">Bulut Stok Takip Sistemi</p>

    <section id="auth">
      <div id="loginForm">
        <h3>Giriş Yap</h3>
        <input id="loginEmail" type="email" placeholder="E-posta">
        <input id="loginPassword" type="password" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
        <button class="secondary" onclick="showRegister()">Yeni Personel Kaydı</button>
        <button class="secondary" onclick="resetPassword()">Şifremi Unuttum</button>
      </div>

      <div id="registerForm" class="hidden">
        <h3>Personel Kaydı</h3>
        <input id="regName" placeholder="Ad Soyad">
        <input id="regEmail" type="email" placeholder="E-posta">
        <input id="regPassword" type="password" placeholder="Şifre (en az 6 karakter)">
        <button onclick="register()">Kayıt Ol</button>
        <button class="secondary" onclick="showLogin()">Giriş Ekranına Dön</button>
      </div>

      <div id="message" class="message hidden"></div>
    </section>

    <section id="pending" class="hidden">
      <h3>Onay Bekleniyor</h3>
      <p>Üyeliğiniz oluşturuldu. Yönetici hesabının onayını bekliyorsunuz.</p>
      <button class="secondary" onclick="logout()">Çıkış Yap</button>
    </section>

    <section id="rejected" class="hidden">
      <h3>Üyelik Onaylanmadı</h3>
      <p>Hesabınız yönetici tarafından onaylanmadı.</p>
      <button class="secondary" onclick="logout()">Çıkış Yap</button>
    </section>

    <section id="dashboard" class="hidden">
      <h3 id="welcome"></h3>
      <p>Giriş başarılı.</p>

      <div id="adminPanel" class="hidden">
        <hr>
        <h3>Personel Onayları</h3>
        <div id="staffList">Yükleniyor...</div>
      </div>

      <button class="secondary" onclick="logout()">Güvenli Çıkış</button>
    </section>
  </div>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://axazlwychehqcpszspoi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XEBT2jlfZP2xobJgUr8KMQ_bos9Oj4T';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function message(text) {
  $('message').textContent = text;
  $('message').classList.remove('hidden');
}

function hideAll() {
  ['auth','pending','rejected','dashboard'].forEach(id =>
    $(id).classList.add('hidden')
  );
}

window.showRegister = () => {
  $('loginForm').classList.add('hidden');
  $('registerForm').classList.remove('hidden');
  $('message').classList.add('hidden');
};

window.showLogin = () => {
  $('registerForm').classList.add('hidden');
  $('loginForm').classList.remove('hidden');
  $('message').classList.add('hidden');
};

window.login = async () => {
  const email = $('loginEmail').value.trim();
  const password = $('loginPassword').value;

  if (!email || !password) return message('E-posta ve şifre girin.');

  const { error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) return message('Giriş hatası: ' + error.message);

  await checkSession();
};

window.register = async () => {
  const full_name = $('regName').value.trim();
  const email = $('regEmail').value.trim();
  const password = $('regPassword').value;

  if (!full_name || !email || !password)
    return message('Tüm alanları doldurun.');

  if (password.length < 6)
    return message('Şifre en az 6 karakter olmalı.');

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { full_name } }
  });

  if (error) return message('Kayıt hatası: ' + error.message);

  if (data.session) {
    await checkSession();
  } else {
    message('Kayıt oluşturuldu. E-posta adresinizi doğrulayın. Ardından yönetici onayı beklenecek.');
  }
};

window.resetPassword = async () => {
  const email = $('loginEmail').value.trim();

  if (!email) return message('Önce e-posta adresinizi yazın.');

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname
  });

  if (error) return message('Hata: ' + error.message);

  message('Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.');
};

window.logout = async () => {
  await supabase.auth.signOut();
  hideAll();
  $('auth').classList.remove('hidden');
  showLogin();
};

async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    hideAll();
    $('auth').classList.remove('hidden');
    return;
  }

  const { data: profile, error } = await supabase
    .from('user_profiles')
    .select('full_name, role, status')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    hideAll();
    $('auth').classList.remove('hidden');
    message('Kullanıcı profili bulunamadı. Yöneticiyle iletişime geçin.');
    return;
  }

  hideAll();

  if (profile.status === 'pending') {
    $('pending').classList.remove('hidden');
    return;
  }

  if (profile.status === 'rejected') {
    $('rejected').classList.remove('hidden');
    return;
  }

  if (profile.status !== 'active') {
    $('auth').classList.remove('hidden');
    message('Hesap durumu geçersiz.');
    return;
  }

  $('dashboard').classList.remove('hidden');
  $('welcome').textContent = 'Hoş geldiniz, ' + profile.full_name;

  if (profile.role === 'admin') {
    $('adminPanel').classList.remove('hidden');
    await loadStaff();
  }
}

async function loadStaff() {
  $('staffList').textContent = 'Personeller yükleniyor...';

  const { data, error } = await supabase
    .from('user_profiles')
    .select('id, full_name, status')
    .eq('role', 'staff')
    .eq('status', 'pending');

  if (error) {
    $('staffList').textContent = 'Personeller alınamadı: ' + error.message;
    return;
  }

  if (!data || data.length === 0) {
    $('staffList').textContent = 'Bekleyen personel bulunmuyor.';
    return;
  }

  $('staffList').innerHTML = '';

  data.forEach(person => {
    const div = document.createElement('div');
    div.className = 'person';

    const name = document.createElement('strong');
    name.textContent = person.full_name || 'İsimsiz personel';

    const actions = document.createElement('div');
    actions.className = 'actions';

    const approve = document.createElement('button');
    approve.textContent = 'Onayla';
    approve.onclick = () => staffAction('approve_staff', person.id);

    const reject = document.createElement('button');
    reject.textContent = 'Reddet';
    reject.className = 'danger';
    reject.onclick = () => staffAction('reject_staff', person.id);

    actions.append(approve, reject);
    div.append(name, actions);
    $('staffList').append(div);
  });
}

async function staffAction(functionName, id) {
  const approved = functionName === 'approve_staff';
  if (!confirm(approved ? 'Bu personeli onaylamak istiyor musunuz?' :
      'Bu personeli reddetmek istiyor musunuz?')) return;

  const { error } = await supabase.rpc(functionName, {
    target_user: id
  });

  if (error) {
    alert('İşlem başarısız: ' + error.message);
    return;
  }

  alert(approved ? 'Personel onaylandı.' : 'Personel reddedildi.');
  await loadStaff();
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    const newPassword = prompt('Yeni şifrenizi girin:');
    if (newPassword) {
      supabase.auth.updateUser({ password: newPassword })
        .then(({ error }) => {
          alert(error ? error.message : 'Şifreniz güncellendi.');
        });
    }
  }
});

await checkSession();
</script>
</body>
</html>
